{% set version = "1.1.2" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-testit
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/testit_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/testit/testit_{{ version }}.tar.gz
  sha256: 6433256444604410850b703c024af88fb48a4f6516f01eef8a9769c8aad4c17a

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('testit')"           # [not win]
    - "\"%R%\" -e \"library('testit')\""  # [win]

about:
  home: https://github.com/yihui/testit
  license: MIT
  summary: A minimal, dependency-free testing framework for R packages. Write tests as simple R expressions that return TRUE, using assert() for assertions (with informative error messages on failure), has_error() / has_warning() / has_message() for testing conditions, and test_pkg() to run all tests with full access 
    to internal (non-exported) package functions. Snapshot testing via Markdown files is also supported.
  license_family: MIT
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/MIT
    - LICENSE

extra:
  recipe-maintainers:
    - conda-forge/r
    - croth1
